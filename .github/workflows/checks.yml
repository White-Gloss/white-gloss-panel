name: Panel checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panel-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node --check dist/server/index.js
      - run: bash -n deploy/install-panel.sh deploy/install-hostinger-ci.sh
      - run: bash -n deploy/panel-release.sh scripts/deploy-ionos.sh scripts/deploy-hostinger.sh
      - run: sudo visudo -cf deploy/white-gloss-panel-ci.sudoers
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-browser-evidence
          path: test-results/
          if-no-files-found: ignore
  deploy:
    name: IONOS panel release
    needs: [check, browser]
    if: vars.PANEL_RELEASE_TARGET == 'ionos' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ionos-panel
      url: https://panel.white-gloss.de
    concurrency:
      group: ionos-panel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Publish separate panel service and verify HTTPS
        run: bash scripts/deploy-ionos.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PANEL_IONOS_HOST: ${{ secrets.PANEL_IONOS_HOST }}
          PANEL_IONOS_PORT: ${{ secrets.PANEL_IONOS_PORT }}
          PANEL_IONOS_SSH_KEY: ${{ secrets.PANEL_IONOS_SSH_KEY }}
          PANEL_IONOS_KNOWN_HOSTS: ${{ secrets.PANEL_IONOS_KNOWN_HOSTS }}
  deploy-hostinger:
    name: Hostinger panel release
    needs: [check, browser]
    # Erst nach dem VPS-Bootstrap und dem Hinterlegen aller Hostinger-Secrets aktivieren.
    if: vars.PANEL_RELEASE_TARGET == 'hostinger' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: hostinger-panel
      url: https://panel.white-gloss.de
    concurrency:
      group: hostinger-panel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Publish panel on Hostinger VPS and verify HTTPS
        run: bash scripts/deploy-hostinger.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PANEL_HOSTINGER_HOST: ${{ secrets.PANEL_HOSTINGER_HOST }}
          PANEL_HOSTINGER_PORT: ${{ secrets.PANEL_HOSTINGER_PORT }}
          PANEL_HOSTINGER_SSH_KEY: ${{ secrets.PANEL_HOSTINGER_SSH_KEY }}
          PANEL_HOSTINGER_KNOWN_HOSTS: ${{ secrets.PANEL_HOSTINGER_KNOWN_HOSTS }}
